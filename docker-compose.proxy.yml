services:
  mongodb:
    image: mongo:8.0
    container_name: software_arch_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: software_arch_team4_development

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: software_arch_web
    command: bin/rails server -b 0.0.0.0
    expose:
      - "3000"
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
      - image_data:${IMAGE_STORAGE_PATH:-/data/images}
    environment:
      RAILS_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/software_arch_team4_development
      MONGODB_TEST_URI: mongodb://mongodb:27017/software_arch_team4_test
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN:-}
      CACHE_ENABLED: "false"
      SEARCH_ENABLED: "false"
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
      SERVE_STATIC: "true"
    depends_on:
      - mongodb

  haproxy:
    image: haproxy:3.0-alpine
    environment:
      RAILS_BACKEND: web:3000
    container_name: software_arch_haproxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
      - image_data:/data/images:ro
    depends_on:
      - mongodb
      - web

volumes:
  mongodb_data:
  bundle_data:
  image_data:
