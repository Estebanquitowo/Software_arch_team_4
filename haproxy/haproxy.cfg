global
  log stdout format raw local0
  maxconn 2048
  tune.ssl.default-dh-param 2048
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option http-server-close
  option forwardfor
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout queue 30s
  retries 3

# Small object cache for static assets (Assignment Phase 6)
cache static_cache
  total-max-size 128
  max-object-size 10000000
  max-age 86400
  process-vary on

frontend http_front
  bind *:80
  bind *:443 ssl crt /usr/local/etc/haproxy/certs/self-signed.pem alpn h2,http/1.1

  # Custom local domain - active host routing (Phase 4.2)
  acl host_app hdr(host) -i app.localhost app.localhost:80 app.localhost:443 localhost localhost:80 localhost:443 127.0.0.1 127.0.0.1:80 127.0.0.1:443
  http-request deny deny_status 403 if !host_app

  # forwarded proto for Rails
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  http-request set-header X-Forwarded-Proto http if !{ ssl_fc }

  # Static asset detection (Phase 6)
  acl is_images path_beg /images/
  acl is_assets path_beg /assets/ /packs/
  acl is_public path_end .png .svg .ico .jpg .jpeg .gif .webp .css .js .txt .map
  acl is_static var(txn.is_static) -m str true
  http-request set-var(txn.is_static) str(true) if is_images || is_assets
  # Also treat known public files as static (favicon, robots)
  http-request set-var(txn.is_static) str(true) if { path /icon.png } || { path /icon.svg } || { path /robots.txt }

  # Try cache first for statics
  http-request cache-use static_cache if { var(txn.is_static) -m str true }

  # Static asset handling at edge (Phase 6)
  # Rails reads shared uploads and serves public/assets on cache misses.
  # HAProxy serves subsequent hits from memory, not from its filesystem.
  # The origin must keep SERVE_STATIC=true. Age / <CACHE> logs prove cache hits.
  acl is_image_file path_beg /images/

  default_backend app_backend

  # Ensure cacheable headers before storing (Rails send_file defaults to private)
  http-response set-header Cache-Control "public, max-age=86400" if { var(txn.is_static) -m str true } { status 200 }
  http-response cache-store static_cache if { var(txn.is_static) -m str true } { status 200 }
  http-response set-header X-Served-By HAProxy if { var(txn.is_static) -m str true }
  http-response set-header X-Frame-Options SAMEORIGIN if { var(txn.is_static) -m str true }

backend app_backend
  balance roundrobin
  option httpchk
  http-check send meth GET uri /up ver HTTP/1.1 hdr host localhost
  http-check expect status 200
  # Compose: web:3000. Kubernetes: stable Service web:80, never individual Pods.
  # A single Compose origin uses web:3000; Kubernetes uses the stable Service
  # address web:80. Dynamic Docker discovery belongs only in the scale config.
  server web "${RAILS_BACKEND}" check inter 5s fall 3 rise 2
  http-request set-header X-Forwarded-Host %[req.hdr(Host)]
  http-request set-header X-Forwarded-For %[src]
