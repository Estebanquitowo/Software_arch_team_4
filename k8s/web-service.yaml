apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: software-arch-team4
  labels:
    app: web
    app.kubernetes.io/name: software_arch_team_4
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
  # Use port-forward for local verification (no NodePort needed):
  #   kubectl -n software-arch-team4 port-forward svc/web 3000:80
  # Alternative for direct Rancher access, uncomment:
  # type: NodePort
  # ports:
  #   - port: 80
  #     targetPort: 3000
  #     nodePort: 30080
