apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: software-arch-team4
  labels:
    app.kubernetes.io/name: software_arch_team_4
    app: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Uses cluster default StorageClass (local-path on k3d).
  # Uncomment to pin explicitly:
  # storageClassName: local-path
