apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: software-arch-team4
  labels:
    app.kubernetes.io/name: software_arch_team_4
    app: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # k3d ships this StorageClass through its local-path provisioner.
  storageClassName: local-path
