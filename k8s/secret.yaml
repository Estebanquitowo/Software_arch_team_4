# Sensitive credentials. Do NOT hard-code in image or ConfigMap.
# This file is a TEMPLATE - replace placeholders before applying.
# For real clusters, prefer imperative creation (avoids committing secrets):
#   kubectl -n software-arch-team4 create secret generic app-secret \
#     --from-literal=HARDCOVER_API_TOKEN="$(grep HARDCOVER_API_TOKEN .env | cut -d= -f2)" \
#     --from-literal=SECRET_KEY_BASE="$(openssl rand -hex 64)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: software-arch-team4
  labels:
    app.kubernetes.io/name: software_arch_team_4
type: Opaque
stringData:
  # Obtain from Hardcover: https://hardcover.app/account/api -> Bearer token without "Bearer " prefix
  HARDCOVER_API_TOKEN: "REPLACE_ME_HARDCOVER_TOKEN"
  # For RAILS_ENV=development (default ConfigMap): used to bypass config/credentials.yml.enc decryption.
  # Generate with: openssl rand -hex 64
  SECRET_KEY_BASE: "REPLACE_ME_GENERATE_WITH_openssl_rand_-hex_64"
  # For RAILS_ENV=production only (when using Dockerfile.production): uncomment and set from config/master.key
  # RAILS_MASTER_KEY: "REPLACE_ME_RAILS_MASTER_KEY"
  # If you enable MongoDB auth in future, add MONGO_INITDB_ROOT_USERNAME / PASSWORD here
